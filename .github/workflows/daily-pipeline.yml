name: Daily Data Pipeline

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  vitals-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-vitals-${{ hashFiles('backend/src/requirements.txt') }}

      - run: pip install -r requirements.txt

      - name: Run vitals snapshot
        run: python get_vitals_snapshot.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

  news-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-news-${{ hashFiles('admin_requirements.txt') }}

      - name: Cache HuggingFace model weights (FinBERT)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert

      - name: Install CPU-only torch
        run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        # admin_requirements.txt also pins torch; strip that line so pip doesn't
        # pull the default CUDA wheel (~2.5GB) over the CPU one installed above.
        run: |
          grep -v '^torch==' admin_requirements.txt > /tmp/admin_requirements.no-torch.txt
          pip install -r /tmp/admin_requirements.no-torch.txt

      - name: Run news pipeline
        run: python get_actual_events.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Recompute theme heat scores
        run: python -m analysislib.sync_themes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
